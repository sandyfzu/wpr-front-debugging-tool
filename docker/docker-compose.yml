# Local WordPress debugging site for the front-end debugging tool.
#
# One command boots everything: docker/scripts/up.sh (down.sh / reset.sh to stop or wipe)
# — see docs/local-site-runbook.md for URLs, credentials, scenario flags and troubleshooting.
#
# Pins, verified to exist at pin time (october 2026), are absolute on purpose: a debugging
# site whose image drifts between runs produces false signals. Runtime versions:
#   - WordPress 7.1.3 on PHP 8.4 (apache)
#   - MariaDB 11.8.9 (LTS line)
#   - wp-cli container 2.12.0 on PHP 8.4 (bootstrap one-shot only; never serves traffic)
#   - WP Rocket comes from docker/wpr/wpr-rocket.zip built by `apvm build` (never committed);
#     the expected build is pinned through WPR_FDT_EXPECTED_WPR_VERSION in .env.example.
name: wprfdt

services:
  db:
    image: mariadb:11.8.9
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  wordpress:
    image: wordpress:7.1.3-php8.4-apache
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      # Published on loopback only: the site is a local debugging fixture, never a
      # network service. The container side is the image-standard port 80 (Apache's
      # bind inside wordpress images); the host side is the pinned free port.
      - '127.0.0.1:${WPR_FDT_TCP_PORT}:80'
    volumes:
      - wp_data:/var/www/html
      # Fixture scenarios (mu-plugin + assets) are host-owned and read-only: the running
      # site can never mutate its own fixtures, which is what keeps runs reproducible.
      # The Support Diagnoser plugin (a later phase) plugs in the same way, as its own
      # bind mount when its phase lands:
      # - ../docker/vendor/wpr-diagnoser:/var/www/html/wp-content/plugins/wpr-diagnoser:ro
      - ./fixtures:/var/www/html/wp-content/mu-plugins:ro
      # The bootstrap's readiness marker, served read-only (the browser tier's readiness
      # URL): up.sh deletes it before every boot and the bootstrap writes it last, so it
      # answers only once THIS boot converged — never from a warm volume mid-bootstrap.
      - ./state:/var/www/html/fdt-state:ro
      # Apache accepts connections immediately (no TCP_DEFER_ACCEPT): an idle
      # preconnected browser socket otherwise stalls behind the port forwarder — the
      # why and the measurements live in the file.
      - ./apache/accept-filter.conf:/etc/apache2/conf-enabled/fdt-accept-filter.conf:ro
    depends_on:
      db:
        condition: service_healthy

  wp-bootstrap:
    image: wordpress:cli-2.12.0-php8.4
    # uid 33 = the www-data of the serving WordPress image above (the Alpine cli image's
    # own www-data is uid 82, which cannot write the 33-owned volume files). Writes must
    # land as the same user Apache serves as, so installs/upgrades succeed permissively.
    user: '33:33'
    restart: 'no'
    # Profiled so a plain `up` never starts it: up.sh drives the one-shot explicitly
    # (a plain `up -d` does not re-run an exited one-shot, which would break the
    # re-apply-everything-per-boot rule).
    profiles: ['bootstrap']
    # One-shot site provisioning, idempotent on every boot: core install when needed,
    # WP Rocket from the apvm-built zip, baseline WP Rocket settings, fixture pages, and
    # the free conflict-plugin set from docker/conflicts.txt (installed inactive).
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WPR_FDT_SITE_URL: ${WPR_FDT_SITE_URL}
      WPR_FDT_ADMIN_USER: ${WPR_FDT_ADMIN_USER}
      WPR_FDT_ADMIN_PASSWORD: ${WPR_FDT_ADMIN_PASSWORD}
      WPR_FDT_ADMIN_EMAIL: ${WPR_FDT_ADMIN_EMAIL}
      WPR_FDT_EXPECTED_WPR_VERSION: ${WPR_FDT_EXPECTED_WPR_VERSION}
    volumes:
      - wp_data:/var/www/html
      - ./wpr:/mnt/wpr:ro
      - ./conflicts.txt:/mnt/conflicts.txt:ro
      - ./bootstrap/bootstrap.sh:/mnt/bootstrap.sh:ro
      - ./bootstrap/seed-settings.php:/mnt/seed-settings.php:ro
      - ./bootstrap/activation.php:/mnt/activation.php:ro
      # Same read-only fixture mount the site gets: wp-cli runs load the must-use
      # plugins exactly as the serving container does, so no hook set is half-present.
      - ./fixtures:/var/www/html/wp-content/mu-plugins:ro
      # Writable side of the readiness marker (see the wordpress service).
      - ./state:/mnt/state
    depends_on:
      db:
        condition: service_healthy
    command: ['sh', '/mnt/bootstrap.sh']

volumes:
  db_data:
  wp_data:
