# Mounted read-only into the wordpress service's conf-enabled/ (docker-compose.yml).
#
# Apache's Linux default `AcceptFilter http data` sets TCP_DEFER_ACCEPT: a connection that
# has sent no bytes stays in SYN_RECV while the kernel retransmits SYN-ACKs. Docker
# Desktop's port forwarder completes the host-side handshake at once, so a browser's
# idle preconnected socket looks open while its container side is still deferred; once
# it has idled ~15 s, the first request on it stalls 6–27 s (measured: raw sockets idle
# 16–28 s; Chromium navigations after an 18 s idle timed out 4 of 8). `none` accepts
# immediately: the idle socket is ESTABLISHED, answers at once, and is closed cleanly by
# mod_reqtimeout's 20 s header wait (the FIN reaches the browser, which drops it).
AcceptFilter http none
