<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vitals shift</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
      }
      .block {
        height: 200px;
        background: #9bc;
      }
    </style>
  </head>
  <body>
    <!-- A layout-shift fixture: 300 ms after load, with no input before it, a
         200 px block is inserted above the content, which moves down (a shift
         this visit's CLS counts). -->
    <main id="content">
      <h1>Vitals fixture</h1>
      <p>The text below moves once.</p>
      <div class="block"></div>
    </main>
    <script>
      addEventListener('load', () => {
        setTimeout(() => {
          const inserted = document.createElement('div');
          inserted.className = 'block';
          inserted.id = 'inserted';
          document.body.insertBefore(inserted, document.getElementById('content'));
        }, 300);
      });
    </script>
  </body>
</html>
