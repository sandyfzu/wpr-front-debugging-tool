<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FDT e2e — page whose DOM answers `browser`</title>
  </head>
  <body>
    <main>
      <h1>A page with a form named "browser"</h1>
      <!-- Named access: `browser` is this form, `browser.runtime.id` reads "x". -->
      <form id="browser"><input name="runtime" id="x" /></form>
    </main>
  </body>
</html>
