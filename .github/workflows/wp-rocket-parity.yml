name: WP Rocket parity

# Re-derives, with the real plugin (`pnpm parity:wp-rocket`, see its header) on
# fresh WP Rocket builds, both parity tables and the simulation data file:
# lib/exclusion-builder/wp-rocket-parity.fixtures.json,
# lib/wp-rocket-simulation/simulation-parity.fixtures.json and
# public/wp-rocket-simulation/simulation-data.json — one run checks all three:
#
# - every supported version (`v` + header.plugins[].version, the registry in
#   lib/wp-rocket/versions.ts; the same list in both headers): each tag is
#   built and every case runs under each — fails as "table stale" /
#   "simulation table stale" / "simulation data file stale" on any row, pin or
#   data difference and as "reference drift" when a build vendored other
#   package versions than its header entry (`--ci`);
# - newer releases: a warning, never a failure, when a wp-media/wp-rocket
#   release tag is newer than every supported version or is a newer patch of a
#   supported minor — release flags are not trusted, pre-releases count
#   (`--release-check`); the newest such tag overall (a new minor wins over a
#   patch) is then built and compared with the tables, warnings only
#   (`--compare`).
#
# Informational: a separate workflow (the `gates` job in ci.yml is untouched),
# not a required check — it runs only when the parity inputs change (PRs, and
# pushes to main/develop/feat/**), weekly, or on demand (`gh workflow run
# wp-rocket-parity.yml --ref <branch>`), and depends on GitHub (APVM release,
# plugin tags), Packagist and wordpress.org. GitHub reads `schedule` and
# `workflow_dispatch` only from the default branch's copy of this file, so a
# feature branch carrying it before it reaches develop runs it via `feat/**`.
on:
  pull_request:
    paths: &parity-paths
      - lib/exclusion-builder/wp-rocket-parity*
      - lib/exclusion-builder/pcre/problems.ts
      - lib/exclusion-builder/stored-row-drops.ts
      - lib/wp-rocket-simulation/simulation-parity*
      - lib/wp-rocket-simulation/simulation-data.ts
      - lib/wp-rocket/constants.ts
      - lib/wp-rocket/versions.ts
      - utils/is-record.ts
      - public/wp-rocket-simulation/**
      - scripts/wp-rocket-parity.*
      - .github/workflows/wp-rocket-parity.yml
  push:
    branches: [main, develop, 'feat/**']
    paths: *parity-paths
  schedule:
    # Mondays 05:17 UTC: catches a newer WP Rocket release and dependency drift.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a newer push supersedes an older run on the same branch (only
# the latest commit's verdict matters). A PR's run has its own ref
# (refs/pull/N/merge), so it never cancels the head branch's push run.
concurrency:
  group: wp-rocket-parity-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit bash = `-eo pipefail`: a failing command anywhere in a pipe fails the step.
    shell: bash

jobs:
  parity:
    name: WP Rocket parity
    # A pinned runner OS, not `-latest`: the plugin build (git, rsync, zip, composer)
    # runs on it; the harness PHP comes from PHP_IMAGE either way.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # APVM CLI release; the binary is verified against that release's checksums.txt.
      APVM_VERSION: v3.3.0
      APVM_NO_UPDATE_CHECK: '1'
      # The harness PHP: php:8.4-cli-bookworm — bundled PCRE2 10.44 + libxml 2.9.14
      # (ext-dom/mbstring compiled in), which reproduces every row of the table. The
      # distro PHPs of the runners do not: PCRE2 10.42 (ubuntu-24.04) predates the
      # 10.43 option letters, libxml 2.15 (ubuntu-26.04) re-serializes attributes.
      # The driver passes `-d pcre.jit=1` on every php call (the JIT moves where the
      # backtrack limit stops a long match; the headers record `pcreJit`).
      PHP_IMAGE: php@sha256:496b5e02fe9fe44fcfb715023b931048111dc4e0bc719789d83c906be9f04b05
      # The pinned versions are read here; the simulation table's header lists the
      # same ones (both are derived from the same zips, so a mismatch fails as stale).
      TABLE: lib/exclusion-builder/wp-rocket-parity.fixtures.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No step pushes; keep the token out of `.git/config`.
          persist-credentials: false

      - name: Install pnpm (version from package.json `packageManager`)
        uses: pnpm/action-setup@v6

      - name: Setup Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # PHP + composer for the APVM build only (composer resolves the plugin's
      # dependencies on the PHP minor the table is generated with locally).
      - name: Setup PHP 8.1 + composer (plugin build)
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          tools: composer
          coverage: none

      - name: Read the pinned versions
        id: reference
        run: |
          versions=$(jq -er '[.header.plugins[].version] | join(" ")' "$TABLE")
          wp=$(jq -er '.header.wp + "-" + .header.wpZipSha1' "$TABLE")
          composer_cache=$(composer config --global cache-dir)
          {
            echo "versions=$versions"
            echo "wp=$wp"
            echo "composer-cache=$composer_cache"
          } >> "$GITHUB_OUTPUT"

      # Composer's download cache only. The APVM artifact cache is never restored
      # across runs: a hit replays the zip without running composer, which would
      # hide dependency drift (a cold build takes ~30 s).
      - name: Cache composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.reference.outputs.composer-cache }}
          key: wpr-parity-composer-${{ runner.os }}-${{ github.run_id }}
          restore-keys: wpr-parity-composer-${{ runner.os }}-

      - name: Cache the pinned WordPress zip
        uses: actions/cache@v6
        with:
          path: .cache/wp-rocket-parity
          key: wpr-parity-wordpress-${{ steps.reference.outputs.wp }}

      - name: Install APVM ${{ env.APVM_VERSION }} (checksum-verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/apvm"
          mkdir -p "$dir/bin"
          cd "$dir"
          gh release download "$APVM_VERSION" -R wp-media/automation-plugin-version-manager \
            -p apvm-linux-x64-gnu -p checksums.txt
          # No checksum line → sha256sum reads nothing and fails; a mismatch fails too.
          grep ' apvm-linux-x64-gnu$' checksums.txt | sha256sum --check
          install -m 0755 apvm-linux-x64-gnu "$dir/bin/apvm"
          echo "$dir/bin" >> "$GITHUB_PATH"
          echo "APVM_CACHE_DIR=$RUNNER_TEMP/apvm-cache" >> "$GITHUB_ENV"

      - name: Build every pinned WP Rocket version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONS: ${{ steps.reference.outputs.versions }}
        run: |
          apvm --version
          mkdir -p docker/wpr
          for version in $VERSIONS; do
            out="$RUNNER_TEMP/wpr-$version"
            apvm build --verbose wp-rocket "tag:v$version" "$out"
            zips=("$out"/wp-rocket-*.zip)
            [ "${#zips[@]}" -eq 1 ] && [ -f "${zips[0]}" ] || { echo "::error::expected one zip in $out"; exit 1; }
            cp "${zips[0]}" "docker/wpr/wpr-rocket-$version.zip"
          done

      # Release flags are not trusted (a stable release may still be flagged
      # pre-release): every non-draft release tag counts, ordered by version.
      - name: Check for WP Rocket releases newer than the pinned versions (warning only)
        id: releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate 'repos/wp-media/wp-rocket/releases?per_page=100' \
            --jq '.[] | select(.draft | not) | .tag_name' > "$RUNNER_TEMP/wpr-release-tags"
          pnpm parity:wp-rocket --release-check < "$RUNNER_TEMP/wpr-release-tags"

      - name: Build the newest newer WP Rocket release
        id: newer
        if: ${{ !cancelled() && steps.releases.outputs.newest != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.releases.outputs.newest }}
        run: |
          out="$RUNNER_TEMP/wpr-newer"
          apvm build --verbose wp-rocket "tag:$TAG" "$out"
          zips=("$out"/wp-rocket-*.zip)
          [ "${#zips[@]}" -eq 1 ] && [ -f "${zips[0]}" ] || { echo "::error::expected one zip in $out"; exit 1; }
          echo "zip=${zips[0]}" >> "$GITHUB_OUTPUT"

      # After the builds (composer must keep the setup-php PHP): from here on, `php`
      # runs in the pinned image, offline, with the workspace and the script's temp
      # directory mounted read-only at their own paths.
      - name: Route the harness PHP to the pinned image
        run: |
          docker pull --quiet "$PHP_IMAGE"
          shim="$RUNNER_TEMP/php-shim"
          mkdir -p "$shim" "$RUNNER_TEMP/parity-tmp"
          cat > "$shim/php" <<EOF
          #!/usr/bin/env bash
          exec docker run --rm -i --network none \\
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \\
            -v "$RUNNER_TEMP/parity-tmp:$RUNNER_TEMP/parity-tmp:ro" \\
            -w "$GITHUB_WORKSPACE" "$PHP_IMAGE" php "\$@"
          EOF
          chmod +x "$shim/php"
          echo "$shim" >> "$GITHUB_PATH"
          echo "TMPDIR=$RUNNER_TEMP/parity-tmp" >> "$GITHUB_ENV"

      - name: Check the tables and the data file against the pinned builds
        run: pnpm parity:wp-rocket --ci

      - name: Compare the newest newer WP Rocket release with the tables (warnings only)
        if: ${{ !cancelled() && steps.newer.outcome == 'success' }}
        continue-on-error: true
        env:
          ZIP: ${{ steps.newer.outputs.zip }}
        run: pnpm parity:wp-rocket --compare --zip "$ZIP"

      - name: Report a failed release check or newer-release build (warning only)
        if: ${{ !cancelled() && (steps.releases.outcome == 'failure' || steps.newer.outcome == 'failure') }}
        env:
          TAG: ${{ steps.releases.outputs.newest }}
        run: |
          if [ -n "$TAG" ]; then
            message="Could not build WP Rocket tag:$TAG with APVM; the comparison was skipped (see the build step log)."
          else
            message='Could not list the WP Rocket releases; the newer-release check was skipped (see its step log).'
          fi
          echo "::warning title=newer release not checked::$message"
          printf '### WP Rocket parity: newer releases\n\n⚠️ %s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
