<!doctype html>
<html lang="en" data-fdt-surface="extension-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Firefox only: the data-sharing consent page. A tool that sends the page
      address opens it in a tab when the grant is missing — the only kind of
      page Firefox lets call `permissions.request` (DevTools panels and
      content scripts have no `permissions` API). Chromium has no such
      consent, so its build has no such page.
    -->
    <meta name="manifest.include" content="['firefox']" />
    <!--
      Paint lock, as on the options page: hidden until the stored appearance
      resolved (`data-theme-lock="done"`), the root still painting the themed
      canvas — no wrong-palette or white first frame (see `./main.tsx`).
    -->
    <style>
      html {
        background-color: var(--surface-0);
      }
      html:not([data-theme-lock='done']) {
        visibility: hidden;
      }
    </style>
    <link rel="stylesheet" href="../../assets/css/theme.css" />
    <title>WPR FDT — Allow sending page addresses</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
